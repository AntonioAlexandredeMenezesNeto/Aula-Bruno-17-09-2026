<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora de IMC</h1>
        <p>Introduza o seu peso e a sua altura para calcular o Índice de Massa Corporal (IMC).</p>
        
        <div class="form-group">
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" placeholder="Ex: 70.5" step="0.1">
        </div>
        
        <div class="form-group">
            <label for="altura">Altura (metros):</label>
            <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01">
        </div>
        
        <button onclick="calcularEExibirIMC()">Calcular IMC</button>
        
        <div id="resultado" class="resultado"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
